const SUPABASE_URL = "https://gqcrbqzhfcybguigkkwa.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_cTV8SNmiDsKvasLivQcc7Q_srxWsClY";
const { createClient } = window.supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

/* =========================================
   CALENDARIO Y RESERVAS
========================================= */

const monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const weekDays=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const timeSlots=["8:00 AM","9:00 AM","10:00 AM","11:00 AM","12:00 PM","1:00 PM","2:00 PM","3:00 PM"];

let calendarDate=new Date();
calendarDate.setDate(1);
let selectedDate=null;
let selectedTime=null;
let selectedService=null;
let occupiedTimes=[];

function formatDate(date){
    return `${weekDays[date.getDay()]}, ${monthNames[date.getMonth()].toLowerCase()} ${date.getDate()}, ${date.getFullYear()}`;
}

function toDatabaseDate(date){
    const year=date.getFullYear();
    const month=String(date.getMonth()+1).padStart(2,"0");
    const day=String(date.getDate()).padStart(2,"0");
    return `${year}-${month}-${day}`;
}

function isPastDate(date){
    const today=new Date();
    today.setHours(0,0,0,0);
    const compare=new Date(date);
    compare.setHours(0,0,0,0);
    return compare<today;
}

function isSunday(date){return date.getDay()===0;}

function showBookingStatus(message,isError=false){
    const element=document.getElementById("bookingStatus");
    element.textContent=message;
    element.style.color=isError ? "#ff7777" : "#00ff82";
}

function showBookingMessage(message,isError=false){
    const element=document.getElementById("bookingMessage");
    element.textContent=message;
    element.style.color=isError ? "#ff7777" : "#00ff82";
}

async function loadOccupiedTimes(){
    occupiedTimes=[];
    if(!selectedDate){renderTimes();return;}

    const {data,error}=await supabaseClient.rpc("obtener_horas_ocupadas",{p_fecha:toDatabaseDate(selectedDate)});

    if(error){
        console.error("Error consultando disponibilidad:",error);
        showBookingMessage("No pudimos consultar la disponibilidad. Intenta nuevamente.",true);
        renderTimes();
        return;
    }

    occupiedTimes=(data||[]).map(row=>row.hora);

    if(selectedTime && occupiedTimes.includes(selectedTime)) selectedTime=null;
    renderTimes();
    updateBookingSummary();
}

function renderCalendar(){
    const month=calendarDate.getMonth();
    const year=calendarDate.getFullYear();
    document.getElementById("calendarMonth").textContent=`${monthNames[month]} ${year}`;
    const daysContainer=document.getElementById("calendarDays");
    daysContainer.innerHTML="";
    const firstDay=new Date(year,month,1).getDay();
    const mondayIndex=firstDay===0?6:firstDay-1;
    const daysInMonth=new Date(year,month+1,0).getDate();

    for(let i=0;i<mondayIndex;i++){
        const empty=document.createElement("div");
        empty.className="calendar-day empty";
        daysContainer.appendChild(empty);
    }

    for(let day=1;day<=daysInMonth;day++){
        const date=new Date(year,month,day);
        const cell=document.createElement("div");
        cell.className="calendar-day";
        cell.textContent=day;
        const today=new Date();

        if(date.getDate()===today.getDate()&&date.getMonth()===today.getMonth()&&date.getFullYear()===today.getFullYear()) cell.classList.add("today");

        if(isPastDate(date)||isSunday(date)){
            cell.classList.add("unavailable");
            cell.title=isSunday(date)?"No hay citas los domingos":"Fecha no disponible";
        }else{
            cell.addEventListener("click",()=>selectDate(date));
        }

        if(selectedDate&&date.getDate()===selectedDate.getDate()&&date.getMonth()===selectedDate.getMonth()&&date.getFullYear()===selectedDate.getFullYear()) cell.classList.add("selected");
        daysContainer.appendChild(cell);
    }
}

function renderTimes(){
    const grid=document.getElementById("timeGrid");
    grid.innerHTML="";

    timeSlots.forEach(time=>{
        const button=document.createElement("button");
        button.type="button";
        button.className="time-button";
        button.textContent=time;
        const occupied=occupiedTimes.includes(time);

        if(occupied){
            button.disabled=true;
            button.classList.add("occupied");
            button.textContent=`${time} • OCUPADO`;
        }else if(!selectedDate){
            button.disabled=true;
        }else{
            button.addEventListener("click",()=>{
                selectedTime=time;
                document.querySelectorAll(".time-button").forEach(b=>b.classList.remove("selected"));
                button.classList.add("selected");
                showBookingMessage("");
                updateBookingSummary();
            });
        }

        if(selectedTime===time&&!occupied) button.classList.add("selected");
        grid.appendChild(button);
    });
}

async function selectDate(date){
    selectedDate=new Date(date);
    selectedTime=null;
    occupiedTimes=[];
    document.getElementById("selectedDateText").textContent=formatDate(selectedDate);
    document.getElementById("customerForm").classList.remove("visible");
    showBookingMessage("");
    renderCalendar();
    renderTimes();
    updateBookingSummary();
    await loadOccupiedTimes();
}

function updateBookingSummary(){
    const summary=document.getElementById("bookingSummary");
    const continueButton=document.getElementById("bookingContinue");

    if(selectedDate&&selectedTime&&selectedService){
        summary.textContent=`${formatDate(selectedDate)} • ${selectedTime} • ${selectedService}`;
        continueButton.disabled=false;
    }else{
        const parts=[];
        if(selectedDate)parts.push(formatDate(selectedDate));
        if(selectedTime)parts.push(selectedTime);
        if(selectedService)parts.push(selectedService);
        summary.textContent=parts.length?parts.join(" • "):"Selecciona día, hora y servicio.";
        continueButton.disabled=true;
    }
}

document.getElementById("prevMonth").addEventListener("click",()=>{
    const now=new Date();
    const currentMonth=new Date(now.getFullYear(),now.getMonth(),1);
    const previousMonth=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);
    if(previousMonth>=currentMonth){calendarDate=previousMonth;renderCalendar();}
});

document.getElementById("nextMonth").addEventListener("click",()=>{
    calendarDate.setMonth(calendarDate.getMonth()+1);
    renderCalendar();
});

document.querySelectorAll(".service-option").forEach(button=>{
    button.addEventListener("click",()=>{
        selectedService=button.dataset.service;
        document.querySelectorAll(".service-option").forEach(b=>b.classList.remove("selected"));
        button.classList.add("selected");
        showBookingMessage("");
        updateBookingSummary();
    });
});

document.getElementById("bookingContinue").addEventListener("click",async()=>{
    if(!selectedDate||!selectedTime||!selectedService)return;
    await loadOccupiedTimes();
    if(!selectedTime||occupiedTimes.includes(selectedTime)){
        showBookingMessage("Ese horario acaba de ser ocupado. Selecciona otro horario.",true);
        return;
    }
    document.getElementById("customerForm").classList.add("visible");
    document.getElementById("customerForm").scrollIntoView({behavior:"smooth",block:"center"});
    showBookingStatus("");
});

document.getElementById("confirmBooking").addEventListener("click",async()=>{
    const name=document.getElementById("customerName").value.trim();
    const phone=document.getElementById("customerPhone").value.trim();
    const email=document.getElementById("customerEmail").value.trim();
    const button=document.getElementById("confirmBooking");

    if(!selectedDate||!selectedTime||!selectedService){showBookingStatus("Selecciona día, hora y servicio.",true);return;}
    if(!name||!phone){showBookingStatus("Nombre y teléfono son obligatorios.",true);return;}
    if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showBookingStatus("Escribe un email válido o déjalo vacío.",true);return;}

    button.disabled=true;
    button.textContent="GUARDANDO...";
    showBookingStatus("Procesando tu reserva...");

    const {data,error}=await supabaseClient.from("reservas").insert({
        nombre:name,telefono:phone,email:email||null,fecha:toDatabaseDate(selectedDate),hora:selectedTime,servicio:selectedService,estado:"confirmada"
    }).select().single();

    if(error){
        console.error("Error creando reserva:",error);
        button.disabled=false;
        button.textContent="CONFIRMAR RESERVA";
        if(error.code==="23505"){
            showBookingStatus("Ese horario acaba de ser reservado por otra persona. Selecciona otro.",true);
            await loadOccupiedTimes();
        }else{
            showBookingStatus("No pudimos guardar la reserva. Intenta nuevamente.",true);
        }
        return;
    }

    console.log("Reserva creada:",data);
    showBookingStatus("¡Reserva confirmada correctamente!");
    showBookingMessage(`¡Cita confirmada! ${formatDate(selectedDate)} a las ${selectedTime}.`);
    button.textContent="RESERVA CONFIRMADA";
    occupiedTimes.push(selectedTime);
    renderTimes();
    setTimeout(()=>document.getElementById("customerForm").classList.remove("visible"),2500);
});

renderCalendar();
renderTimes();
updateBookingSummary();

        );

    }
);


window.addEventListener(
    "hashchange",
    function(){

        showPage(

            location.hash.replace(
                "#",
                ""
            ),

            false

        );

    }
);


/* =========================================
   TECLADO
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key===
            "ArrowRight"
        ){

            document
            .getElementById(
                "nextPage"
            )
            .click();

        }


        if(
            event.key===
            "ArrowLeft"
        ){

            document
            .getElementById(
                "prevPage"
            )
            .click();

        }

    }
);


/* =========================================
   INICIAR
========================================= */

showPage(

    location.hash.replace(
        "#",
        ""
    )

    ||

    "inicio",

    false

);

</script>

</body>
</html>
